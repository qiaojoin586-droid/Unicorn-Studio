server:
  port: 8080
  address: 127.0.0.1

spring:
  # ==================== 本地开发配置（不入库）====================
  # 真实凭据（DB/Redis 口令、各项 SECRET）一律不进仓库：application.yml 只保留 ${VAR:} 空占位，
  # 本地值放 application-local.yml —— 该文件已加入 .gitignore，模板见 application-local.yml.example。
  # optional: 前缀保证生产环境（无此文件）不受影响，由环境变量注入。
  config:
    import: optional:classpath:application-local.yml
  # ==================== Spring AI（AI 助手模块）====================
  # 模型实例在运行时由 AIWorker.ChatClientFactory 按数据库配置手动构建，
  # 不使用 starter 的自动装配，故在此排除全部自动配置的模型 Bean。
  # 必须排除的原因：这些自动配置会强制校验 spring.ai.openai.api-key，
  # 而本项目的 key 存在数据库（禁止在配置文件里放第二份明文），会导致启动失败。
  # 已同时在 UnicornStudioApplication 的 exclude 属性中声明（双保险）。
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  # 上传体积上限（V11 支持动态壁纸时补齐）：
  # 此前未配置 spring.servlet.multipart，Spring Boot 默认 max-file-size=1MB，
  # 导致超过 1MB 的图片/文档在进入 FileService 之前就被 Servlet 层拒绝
  # （app.upload.max-size 的 10MB 应用上限实际不可达）。
  # 这里放开到视频所需上限，分类上限仍由 FileService 二次校验（图片/文档 10MB、视频 50MB）。
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 56MB
  # 定时任务调度器（B-05）：不配置时全部 @Scheduled 落在 Spring Boot 自动配置的
  # ThreadPoolTaskScheduler 上，池大小 = 1。而当前有 5 个定时任务，其中
  # ViewCountService.flush 每 2 分钟一轮（逐 key 两次 Redis 往返 + N 条 UPDATE），
  # 一旦某轮耗时超过 2 分钟就会持续挤占唯一的调度线程，使 01:00 埋点聚合、
  # 03:00 统计、03:30 数据保留清理被无限推迟（同一调度器上串行执行）。
  # 这里用配置项而非自定义 Bean：Boot 自动配置本身也提供一个 TaskScheduler，
  # 两个同类型 Bean 共存时 Spring 的选取规则依赖版本，容易出现「配了却没生效」。
  task:
    scheduling:
      pool:
        # 5 个任务里同一时刻最多 2 个真正重叠（心跳类 flush 与日级整点任务），4 足够并留余量
        size: 4
      thread-name-prefix: sched-
      shutdown:
        await-termination: true
        await-termination-period: 60s
  datasource:
    # MySQL 8（本机/部署均用 MySQL；表结构由 backend/sql/mysql-init.sql 初始化，无 ORM 自动建表）
    url: jdbc:mysql://127.0.0.1:3306/unicorn_studio?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    # 密码必须显式配置（环境变量 DB_PASSWORD，或本地 application-local.yml）。
    # 这里【没有默认值】：曾出现过的 ${DB_PASSWORD:123456} 属弱口令且已随仓库公开，
    # 启动时由 SecretsStartupValidator 校验非空，缺失即拒绝启动。
    password: ${DB_PASSWORD:}
    # Druid 连接池（stat filter 提供 SQL 监控统计，见 /api/admin/sql-monitor）
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 2
      min-idle: 1
      max-active: 10
      max-wait: 10000
      filter:
        stat:
          enabled: true
          slow-sql-millis: 2000
          log-slow-sql: true
      # 安全：不暴露 Druid 原生监控页，监控走自封接口（权限码 system:sql）
      stat-view-servlet:
        enabled: false
  mail:
    # 邮件通知可选：不配置 SMTP_* 则留言回复不发送邮件（仅记日志）
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
  data:
    redis:
      # ---- 拓扑：单机 与 哨兵 通过环境变量切换，应用代码零改动（Redis 方案 §4.3 A7）----
      # 单机（开发/小站）：默认走 host+port
      # 无默认值：此前的默认值是【真实公网 IP + 真实口令】且已进入 git 历史（S-4），
      # 必须显式配置 REDIS_HOST / REDIS_PASSWORD（或本地 application-local.yml）。
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:6379}
      # 哨兵（生产推荐）：设置 REDIS_SENTINEL_NODES 后启用，需把上面的 host/port 留空
      # sentinel:
      #   master: ${REDIS_SENTINEL_MASTER:mymaster}
      #   nodes: ${REDIS_SENTINEL_NODES:}
      #   password: ${REDIS_SENTINEL_PASSWORD:}
      password: ${REDIS_PASSWORD:}
      # 本应用独占 db 0（Redis Cluster 只支持 db 0，将来上 Cluster 改按 key 前缀隔离）
      database: ${REDIS_DATABASE:0}
      # 必须显式设置超时与连接池（Redis 方案 §4.3 A5）：避免 Redis 不可达时线程长时间挂起
      timeout: 300ms
      connect-timeout: 200ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 200ms

# MyBatis Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      db-type: mysql
      # 全列更新（等价 JPA save 语义）：允许显式置 null 的清字段场景（登出清 token/解锁/解禁）。
      # 约定：update 路径必须先 selectById 加载完整实体再改字段；个别字段可用 @TableField(updateStrategy = NOT_NULL) 局部覆盖
      update-strategy: ignored

app:
  cors:
    # 前台 dev 5173 / 后台 dev 5174 / 前台 Node 生产服务 3000（含 localhost 与 127.0.0.1 两种写法，
    # 二者在浏览器中属不同 Origin，缺一即返回 403 Invalid CORS request）
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:3000}
    # 通配模式（容忍端口变动，如 Vite 自动换端口 / Node 改端口）；仅放开本机任意端口，不涉公网域名。
    # 生产环境请用 APP_CORS_ORIGIN_PATTERNS 显式收窄，设为空串则仅按 allowed-origins 精确匹配。
    allowed-origin-patterns: ${APP_CORS_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*]}
  ai:
    # ==================== AI 助手（com.unicorn.studio.AIWorker，基于 Spring AI）====================
    # 运行时配置（API Key / API 地址 / 模型 / 提示词 / 采样参数）自 V16 起统一存
    # site_settings 的 ai 组，由后台「AI 配置」页（/admin/ai-config）维护，
    # 保存后即时生效、无需重启；此处仅保留部署级开关。
    #
    # 工具层（Function Calling 扩展位，见 AIWorker/tool）：
    # false=只做基础问答（当前默认，符合「现阶段先实现最基础的问答功能」）；
    # true=把已注册的 AiTool 实现装配给模型，启用前请确认工具实现已就绪。
    tools:
      enabled: ${AI_TOOLS_ENABLED:false}
    # AI 接口地址（apiUrl）域名白名单，逗号分隔（S-3）。
    # 为什么必须有：apiUrl 由管理员填写，服务端会带着【库中明文 API Key】请求该地址 ——
    # 只拦内网地址挡不住「指向攻击者自己的公网服务器」，白名单才是防 Key 外带的关键。
    # 留空 = 不限制域名（仍有内网/环回/链路本地地址拦截），但存在 Key 外带风险。
    # 更换/新增供应商时把域名加进来即可（匹配规则：精确相等或为其子域名）。
    allowed-api-hosts: ${AI_ALLOWED_API_HOSTS:bigmodel.cn,openai.com,deepseek.com,moonshot.cn,aliyuncs.com,volces.com,baidubce.com,anthropic.com,openrouter.ai,siliconflow.cn}
  crypto:
    # 敏感配置加密密钥（AI API Key 等）：AES-256-GCM。
    # 必须设置环境变量 APP_CRYPTO_SECRET：≥32 字符的【随机串，不是人类可记口令】
    # （派生算法是单轮 SHA-256，无盐无迭代，见 CryptoService.deriveKey 的说明）。
    # 未配置或长度不足 32 时【拒绝启动】；不再回退 app.admin.jwt-secret（机密性与完整性密钥必须分离）。
    # 注意：更换该值会导致已存储的密文无法解密，需在后台重新填写 API Key。
    secret: ${APP_CRYPTO_SECRET:}
    # 仅本地开发：无密钥时允许明文存储。生产必须保持 false。
    allow-plaintext: ${APP_CRYPTO_ALLOW_PLAINTEXT:false}
  public:
    # 前台用户 token（评论等前台操作的身份识别）签名密钥，独立于后台 admin.jwt-secret。
    # 【必须显式配置】：此项此前在 yml 中完全缺失，而 PublicAuthService 的 @Value 带一个
    # 随源码提交进 git 的硬编码默认值 —— 按默认配置部署时任何人都能用该公开密钥
    # 伪造任意前台用户 token。未配置或长度不足 32 时拒绝启动。
    # ⚠️ 轮换该值会使所有已签发的前台 token 立即失效（预期行为）。
    jwt-secret: ${PUBLIC_JWT_SECRET:}
  security:
    # 可信代理跳数（X-Forwarded-For 采信层数），从右往左取第 N 跳：
    #   0（默认，安全值）= 完全不信任 XFF，只用 remoteAddr
    #   N>0              = 信任最右 N 跳，必须等于实际代理层数
    # 本应用 server.address=127.0.0.1 只监听回环、必然经代理，部署时须配成实际层数。
    # ⚠️ 配小会让全站共用一个限流桶（取到代理自身 IP）；配大等于采信攻击者提供的值。
    trusted-proxy-count: ${TRUSTED_PROXY_COUNT:0}
  admin:
    # 后台管理 JWT/账号配置；jwt-secret 为空时 JwtService 拒绝启动
    jwt-secret: ${ADMIN_JWT_SECRET:}
    jwt-expire-hours: 2
    refresh-expire-days: ${ADMIN_JWT_REFRESH_EXPIRE_DAYS:7}
    # 初始密码为空时由 AdminBootstrap 生成随机密码并打印日志（仅本地开发）
    init-password: ${ADMIN_INIT_PASSWORD:}
  upload:
    dir: ${FILE_UPLOAD_DIR:data/uploads}
    max-size: ${FILE_UPLOAD_MAX_SIZE:10485760}
    # 视频（动态壁纸）独立上限：50MB，与 spring.servlet.multipart.max-file-size 对齐
    video-max-size: ${FILE_UPLOAD_VIDEO_MAX_SIZE:52428800}
    # 富文本外链图白名单域（空=仅允许本站 /uploads/）
    image-allow-origins: ${IMAGE_ALLOW_ORIGINS:}
  backup:
    dir: ${BACKUP_DIR:data/backups}
    retention-count: ${BACKUP_RETENTION_COUNT:7}
    mysqldump-path: ${MYSQLDUMP_PATH:mysqldump}
    cron: ${BACKUP_CRON:0 0 2 * * *}
  retention:
    # 数据保留清理（审计日志 / SQL 监控）：保留期限本身存 site_settings(retention.days)，
    # 后台「数据保留」页面可改为 7/15/30/90 天，改后即时生效（每次执行都重新读取）。
    # 这里只放部署级参数：执行周期与单轮删除上限。
    # 默认每日 03:30，错开 01:00 埋点聚合、02:00 备份、03:00 统计聚合等既有定时任务。
    cron: ${RETENTION_CRON:0 30 3 * * *}
    # 单轮最多删除行数，防止首次接入时一次性删空历史数据造成长事务/主从延迟
    max-delete-per-run: ${RETENTION_MAX_DELETE:50000}
  ratelimit:
    login-per-minute: 5
    register-per-hour: 10
    comment-per-minute: 10
    guest-comment-per-hour: 10
    message-per-hour: 5
    stats-per-minute: 60
    # AI 对话（/api/ai/chat）：每次调用产生真实外部 API 费用，按 IP 限流（§3.4 C6①）
    ai-per-minute: 5
  cache:
    # V15 Redis 缓存方案（docs/Redis缓存设计设计方案.md 附录 A）
    # enabled=false 必须能一键回到「全部直读 MySQL」—— 灰度上线与故障应急的生命线。
    enabled: ${CACHE_ENABLED:true}
    warmup:
      enabled: ${CACHE_WARMUP_ENABLED:true}
    ttl:
      site: 30m
      content: 30m
      detail: 60m
      comment: 5m
      dashboard: 60s
      user: 5m
      permission: 10m
      null-marker: 60s
      views-dirty: 7d
    null-marker:
      enabled: true
    jitter-ratio: 0.10
    circuit-breaker:
      failure-threshold: 10
      open-duration: 30s

logging:
  # 日志文件目录（相对运行目录）：logback-spring.xml 按级别/日期分目录写入
  # info/yyyy-MM-dd/app-info.log（全量）、warn/.../app-warn.log（仅警告）、
  # error/.../app-error.log（仅错误）、admin/.../app-admin.log（管理端操作审计），各保留 30 天
  file:
    path: ./logs
  # 控制台编码（2026-09-11 修复中文乱码）：
  # Spring Boot 默认把控制台编码设为 UTF-8（LoggingSystemProperties.CONSOLE_CHARSET 默认值），
  # 而 IDEA Run 控制台 / Windows 中文控制台按系统代码页 CP936(GBK) 解码子进程输出流，
  # 于是中文日志显示成「闈欐€佽祫婧愪笉瀛樺湪」这类乱码。
  # 这里把控制台编码对齐为 GBK（由 Spring Boot 发布为 CONSOLE_LOG_CHARSET，
  # 供 logback-spring.xml 引入的 console-appender.xml 使用）。
  # 文件日志不受影响：各 file appender 固定 UTF-8。
  # 若终端本身是 UTF-8（Windows Terminal / Git Bash / IDEA 控制台编码已设为 UTF-8），改回 UTF-8 即可。
  charset:
    console: GBK
    file: UTF-8
  level:
    com.unicorn.studio: INFO
    org.springframework.security: WARN
