server:
  address: 127.0.0.1
  # HTTP 响应压缩（B-14）：此前 server 段只有 port/address，compression 默认关闭，
  # 所有 JSON 以明文传输。后台列表接口、仪表盘汇总、站点配置等高度可压缩的文本收益明显。
  # 生产若由 nginx 反代，nginx 侧开 gzip 也可，但两者不冲突，且开发/直连与内网调用只能靠应用侧。
  compression:
    enabled: true
    # ⚠️ 刻意【不含 text/event-stream】：AI 对话的 SSE 分片靠「逐片直出」保证实时性，
    # 而压缩器要攒够缓冲才吐数据 —— 一旦把 SSE 纳入压缩，逐字回显会变成「卡一下冒一段」。
    # 这是本节唯一需要谨慎的点，故宁可让 SSE 不压缩。
    mime-types: application/json,application/javascript,text/html,text/plain,text/css,text/xml
    # 小于 1KB 不压：压完反而可能变大（gzip 头开销 + 小响应本来就没有冗余）
    min-response-size: 1024

spring:
  # 上传体积上限（V11 支持动态壁纸时补齐）：
  # 此前未配置 spring.servlet.multipart，Spring Boot 默认 max-file-size=1MB，
  # 导致超过 1MB 的图片/文档在进入 FileService 之前就被 Servlet 层拒绝
  # （app.upload.max-size 的 10MB 应用上限实际不可达）。
  # 这里放开到视频所需上限，分类上限仍由 FileService 二次校验（图片/文档 10MB、视频 50MB）。
  servlet:
    multipart:
      max-file-size: 50MB  #
      max-request-size: 56MB
  # 定时任务调度器（B-05）：不配置时全部 @Scheduled 落在 Spring Boot 自动配置的
  # ThreadPoolTaskScheduler 上，池大小 = 1。而当前有 5 个定时任务，其中
  # ViewCountService.flush 每 2 分钟一轮（逐 key 两次 Redis 往返 + N 条 UPDATE），
  # 一旦某轮耗时超过 2 分钟就会持续挤占唯一的调度线程，使 01:00 埋点聚合、
  # 03:00 统计、03:30 数据保留清理被无限推迟（同一调度器上串行执行）。
  # 这里用配置项而非自定义 Bean：Boot 自动配置本身也提供一个 TaskScheduler，
  # 两个同类型 Bean 共存时 Spring 的选取规则依赖版本，容易出现「配了却没生效」。
  task:
    scheduling:
      pool:
        # 5 个任务里同一时刻最多 2 个真正重叠（心跳类 flush 与日级整点任务），4 足够并留余量
        size: 4
      thread-name-prefix: sched-
      shutdown:
        await-termination: true
        await-termination-period: 60s
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/unicorn_studio?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456

    druid:
      initial-size: 2
      min-idle: 5
      max-active: 20
      max-wait: 3000
      filter:
        stat:
          enabled: true
          slow-sql-millis: 2000
          log-slow-sql: true
      # 安全：不暴露 Druid 原生监控页，监控走自封接口（权限码 system:sql）
      stat-view-servlet:
        enabled: false
  data:
    redis:
      host: localhost
      timeout: 300ms  # Redis 命令超时
      connect-timeout: 200ms
      lettuce:
        pool:
          max-active: 16
          min-idle: 2
          max-wait: 200ms

# MyBatis Plus
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      # 全列更新（等价 JPA save 语义）：允许显式置 null 的清字段场景（登出清 token/解锁/解禁）。
      # 约定：update 路径必须先 selectById 加载完整实体再改字段；个别字段可用 @TableField(updateStrategy = NOT_NULL) 局部覆盖
      update-strategy: ignored

app:
  site:
    # 站点对外的完整地址（协议 + 域名），如 https://unicorn-studio.top
    # ⚠️ 工具返回给访客的页面地址必须用完整地址 —— 相对路径（/works）在回答里没法点，
    #    访客复制到地址栏也是错的。
    # ⚠️ 为什么不用请求的 Host 头：Host / X-Forwarded-Host 是客户端可控的，
    #    用它拼给访客的链接等于允许伪造出一个指向别处的地址（钓鱼）。基址必须服务端自己定。
    # ⚠️ 留空时工具会回落到相对路径（并在服务端记 WARN），绝不会自己编一个域名。
    base-url: ${SITE_BASE_URL:}
  cors:
    # 前台 dev 5173 / 后台 dev 5174 / 前台 Node 生产服务 3000（含 localhost 与 127.0.0.1 两种写法，
    # 二者在浏览器中属不同 Origin，缺一即返回 403 Invalid CORS request）
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:3000}
    # 通配模式（容忍端口变动，如 Vite 自动换端口 / Node 改端口）；仅放开本机任意端口，不涉公网域名。
    # 生产环境请用 APP_CORS_ORIGIN_PATTERNS 显式收窄，设为空串则仅按 allowed-origins 精确匹配。
    allowed-origin-patterns: ${APP_CORS_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*]}
  ai:
    # 仅在部署环境需要代理访问 AI 服务时设置，例如 http://127.0.0.1:7890。
    # 留空使用 JVM 默认网络策略。
    http-proxy: '${AI_HTTP_PROXY:}'
    # ==================== AI 助手（com.unicorn.studio.AIWorker，基于 Spring AI）====================
    # 记忆（§10 预留契约）：带入模型的历史轮数。
    # ⚠️ 这是【上下文窗口】不是【历史】：历史全量落库（90 天清理），记忆只取最近几轮，
    #    两者长度独立、互不影响。轮数直接决定每次调用的 input token 成本。
    # ⚠️ 默认 10 轮 = 20 条消息，与功能②落地时的硬编码值一致 ⇒ 行为不变。
    memory:
      max-turns: ${AI_MEMORY_MAX_TURNS:10} #  AI带入对话的记忆选择最近十轮
    history-cleanup:
      retention-days: ${AI_HISTORY_RETENTION_DAYS:90}  #  最大日志保存的时间为90天
      # 默认每日 04:30，错开既有定时任务：01:00 统计 / 02:00 备份 / 03:00 封禁清理 / 03:30 数据保留。
      # ⚠️ 不要挪到 03:45 —— 距 retention 的 03:30 只差 15 分钟，两者共用 Druid 池（max-active 20）。
      cron: ${AI_HISTORY_CLEANUP_CRON:0 30 4 * * *}
      # 单轮最多删除行数（消息 + 会话合计），防首次接入时一次删空造成长事务/主从延迟
      max-delete-per-run: ${AI_HISTORY_MAX_DELETE:50000}
    # ==================== AI 问答配额（§9.3 / R12）====================
    # 本期只建结构、默认关闭：R12 是"预留"不是"现在要限"，计数与开关先就位，打开只改这里。
    quota:
      daily-enabled: ${AI_QUOTA_DAILY_ENABLED:false}
      monthly-enabled: ${AI_QUOTA_MONTHLY_ENABLED:false}
      daily-limit: ${AI_QUOTA_DAILY_LIMIT:100}
      monthly-limit: ${AI_QUOTA_MONTHLY_LIMIT:1000}
    # ==================== AI 工具（§7.6 / §11）====================
    # 工具层的作用：让模型能查本站的实时数据，而不是凭训练时的记忆编（设计方案 §11.1）。
    # ⚠️ 整个段落的总开关默认关闭：打开前得先把内置工具写出来（工具层建议 §4 的 P0 十个），
    #    否则模型"看得见工具却没什么可调"，反而显得更没能力。
    tools:
      # 总开关。false 时 callbacks() 返回空数组 ⇒ 行为与纯问答完全一致（§13 验收项：可一键回退）。
      enabled: ${AI_TOOLS_ENABLED:false}
      # 允许 http 明文（默认 false）。内网自建服务常只有 http，确需时显式打开；
      # 与 app.crypto.allow-plaintext 同性质——默认安全，放开要显式。
      allow-http: ${AI_TOOLS_ALLOW_HTTP:false}
      # 单工具熔断（§11.5：连续 3 次失败 → 熔断 5 分钟）。
      # 熔断期间该工具不装配：上游持续挂着时模型会反复重试，白烧 token 且拖到 SSE 180s 超时。
      circuit-breaker:
        failure-threshold: ${AI_TOOLS_BREAKER_FAILURE_THRESHOLD:3}
        open-duration: ${AI_TOOLS_BREAKER_OPEN_DURATION:5m}
      # 单轮对话的工具调用预算（§11.5：≤3 次 / 累计 15 秒）。
      # ⚠️ 是【每轮对话】不是【每次调用】——一轮里模型可以连着调多个工具，共享同一份预算。
      # 预算耗尽时返回契约化错误让模型基于已有信息作答，不抛异常（SSE 不断流）。
      budget:
        max-calls: ${AI_TOOLS_BUDGET_MAX_CALLS:3}
        max-duration-millis: ${AI_TOOLS_BUDGET_MAX_DURATION_MILLIS:15000}
    # AI 接口地址（apiUrl）域名白名单，逗号分隔（S-3）。
    # 为什么必须有：apiUrl 由管理员填写，服务端会带着【库中明文 API Key】请求该地址 ——
    # 只拦内网地址挡不住「指向攻击者自己的公网服务器」，白名单才是防 Key 外带的关键。
    # 留空 = 不限制域名（仍有内网/环回/链路本地地址拦截），但存在 Key 外带风险。
    # 更换/新增供应商时把域名加进来即可（匹配规则：精确相等或为其子域名）。
    allowed-api-hosts: ${AI_ALLOWED_API_HOSTS:bigmodel.cn,openai.com,deepseek.com,moonshot.cn,aliyuncs.com,volces.com,baidubce.com,anthropic.com,openrouter.ai,siliconflow.cn}
  crypto:
    # 敏感配置加密密钥（AI API Key 等）：AES-256-GCM。
    # APP_CRYPTO_SECRET 可覆盖本地密钥：≥32 字符的【随机串，不是人类可记口令】
    # （派生算法是单轮 SHA-256，无盐无迭代，见 CryptoService.deriveKey 的说明）。
    # 未配置或长度不足 32 时【拒绝启动】；不再回退 app.admin.jwt-secret（机密性与完整性密钥必须分离）。
    # 注意：更换该值会导致已存储的密文无法解密，需在后台重新填写 API Key。
    secret: '${APP_CRYPTO_SECRET:unicorn-studio-dev-crypto-secret-2026-key}'
    # 仅本地开发：无密钥时允许明文存储。生产必须保持 false。
    allow-plaintext: ${APP_CRYPTO_ALLOW_PLAINTEXT:false}
  public:
    # 前台用户 token（评论等前台操作的身份识别）签名密钥，独立于后台 admin.jwt-secret。
    # PUBLIC_JWT_SECRET 可覆盖本地密钥，未配置或长度不足 32 时拒绝启动。
    # ⚠️ 轮换该值会使所有已签发的前台 token 立即失效（预期行为）。
    jwt-secret: '${PUBLIC_JWT_SECRET:LVV61kYbL4h8jManhR4zHWpAhBxJWZJqg7QdJqYhCtNi5HUE}'
    registration-sms:
      # 本地测试时显式开启，验证码只输出到后端控制台。
      console-enabled: ${REGISTRATION_SMS_CONSOLE_ENABLED:false}
  security:
    # 可信代理跳数（X-Forwarded-For 采信层数），从右往左取第 N 跳：
    #   0（默认，安全值）= 完全不信任 XFF，只用 remoteAddr
    #   N>0              = 信任最右 N 跳，必须等于实际代理层数
    # 【本项目已确认的拓扑】生产 = nginx → 后端（无 Node 生产服务），即 1 层代理 →
    # 生产环境把它设为 1（TRUSTED_PROXY_COUNT=1）。本地经 Vite(5173) 或 Node 生产服务(3000)
    # 代理访问，同样是 1 层，本文件默认值为 1。
    # 本应用 server.address=127.0.0.1 只监听回环、必然经代理，故这个值不能留 0（留 0 取到的是
    # 代理自身 IP，全站共用一个限流桶）；配大则等于采信攻击者伪造的 XFF。
    trusted-proxy-count: '${TRUSTED_PROXY_COUNT:1}'



  admin:
    # 后台管理 JWT/账号配置；jwt-secret 为空时 JwtService 拒绝启动
    jwt-secret: '${ADMIN_JWT_SECRET:2oxbUQO2mn77QvjZA0Y6nlAhDU7k5XFAGXit7AWQw2vCk}'
    refresh-expire-days: ${ADMIN_JWT_REFRESH_EXPIRE_DAYS:7}
    # 初始密码为空时由 AdminBootstrap 生成随机密码并打印日志（仅本地开发）
    init-password: ${ADMIN_INIT_PASSWORD:}
  upload:
    dir: ${FILE_UPLOAD_DIR:data/uploads}
    max-size: ${FILE_UPLOAD_MAX_SIZE:10485760}
    # 视频（动态壁纸）独立上限：50MB，与 spring.servlet.multipart.max-file-size 对齐
    video-max-size: ${FILE_UPLOAD_VIDEO_MAX_SIZE:52428800}
    # 富文本外链图白名单域（空=仅允许本站 /uploads/）
    image-allow-origins: ${IMAGE_ALLOW_ORIGINS:}
  backup:
    dir: ${BACKUP_DIR:data/backups}
    retention-count: ${BACKUP_RETENTION_COUNT:7}
    mysqldump-path: ${MYSQLDUMP_PATH:mysqldump}
    cron: ${BACKUP_CRON:0 0 2 * * *}
  retention:
    # 数据保留清理（审计日志 / SQL 监控）：保留期限本身存 site_settings(retention.days)，
    # 后台「数据保留」页面可改为 7/15/30/90 天，改后即时生效（每次执行都重新读取）。
    # 这里只放部署级参数：执行周期与单轮删除上限。
    # 默认每日 03:30，错开 01:00 埋点聚合、02:00 备份、03:00 统计聚合等既有定时任务。
    cron: ${RETENTION_CRON:0 30 3 * * *}
    # 单轮最多删除行数，防止首次接入时一次性删空历史数据造成长事务/主从延迟
    max-delete-per-run: ${RETENTION_MAX_DELETE:50000}
  ratelimit:
    # AI 对话（/api/ai/chat）：每次调用产生真实外部 API 费用，按 §3.4 C6① 限流。
    # ⚠️ 这是【用户维度】的上限（按 userId 计），IP 维度是它的 3 倍（见 RateLimitFilter）。
    #   用户维度 15 次/分：正常人一分��问 15 个问题已经远超实际使用量，
    #   挡的是「连点/脚本」而不是「正常提问」——限流太紧会被正常用户投诉。
    #   IP 维度 45 次/分：兜底挡批量注册的小号（同一 IP 下多账号狂刷）。
    # ⚠️ 分钟级限流只挡瞬时刷爆，长期消耗要看 app.ai.quota 的日/月配额（当前默认关闭）。
    ai-per-minute: 15
  cache:
    # V15 Redis 缓存方案（docs/Redis缓存设计设计方案.md 附录 A）
    # enabled=false 必须能一键回到「全部直读 MySQL」—— 灰度上线与故障应急的生命线。
    enabled: ${CACHE_ENABLED:true}
    # 缓存键环境隔离（2026-09-22 实测故障后新增）：
    # 本地开发与线上服务器共用同一台 Redis 的同一个 db，而键名里原本没有任何环境标识，
    # 于是两边互相读写对方的缓存 —— 服务器写进去的学习资料（7 条，带它自己的 /uploads/... 封面）
    # 会被本地实例读到并渲染，而对应文件只在服务器磁盘上 ⇒ 图片/附件必然 404；
    # 反过来线上读到本地写的缓存也一样。TTL 续期让它表现为「过一段时间才 404」，极难定位。
    # 现在每个键都带 "<profile>:" 前缀（见 CacheHelper.buildPrefix），两套环境天然隔离，
    # 即使共用一台 Redis 也不会互相污染。要再加固可加本项（如 unicorn），或给本地换 REDIS_DATABASE。
    namespace: ${CACHE_NAMESPACE:}
    warmup:
      enabled: ${CACHE_WARMUP_ENABLED:true}

# ==================== 运维可观测性（B-19 / S-6）====================
# 为什么需要：改动前后没有量化基线，收益无法证明、回归无法发现。
# 为什么配置得这么「紧」：/actuator/heapdump 会导出【整个堆】，其中驻留着
# AiRuntimeConfig 里已解密的明文 API Key、Redis/DB 口令等一切运行时明文 ——
# 一次未授权下载 = 全部密钥泄漏。故采取三层收敛：
#   ① 独立管理端口且只绑回环（网络层，本项目 server.address 同理）；
#   ② ActuatorSecurityConfig 里一条独立的、默认拒绝的过滤器链（代码层，见该类注释：
#      「端口绑定」是部署级的、改一行配置就失效，而过滤链是代码级的安全边界）；
#   ③ 默认不暴露 heapdump/env/configprops/beans。
management:
  server:
    # 不复用 8080：管理端点与业务流量的暴露面必须分开
    port: ${MANAGEMENT_PORT:8081}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        # 只开这四个。刻意【不含】：
        #   heapdump —— 整个堆含明文密钥；需要堆转储时用 jcmd <pid> GC.heap_dump 离线获取
        #   env / configprops / beans —— 会回显 application.yml 解析后的实际取值（含口令）
        #   shutdown —— 远程关停能力，没有任何场景需要它
        include: health,metrics,threaddump,loggers
  health:
    # 邮件通知可选。健康状态由核心依赖决定，即使 SMTP 已配置也不探测邮件服务器。
    mail:
      enabled: false
  endpoint:
    health:
      # 不对外暴露依赖细节（哪个库连不上、版本号等），只给聚合状态
      show-details: never
  metrics:
    # 给 HTTP 指标打上 URI 标签，便于按接口看 P95/P99
    tags:
      application: unicorn-studio

logging:
  # 启动、运行、接口访问和管理审计统一写入 app.log，同时保留控制台输出。
  # ./logs 相对启动工作目录；服务器建议设置 LOG_DIR=/opt/unicorn-studio/logs。
  file:
    name: ${LOG_DIR:./logs}/app.log
  logback:
    rollingpolicy:
      file-name-pattern: ${logging.file.name}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 2GB
      clean-history-on-start: true
  charset:
    # 控制台和日志文件统一使用 UTF-8。
    console: UTF-8
    file: UTF-8
  level:
    root: INFO
    com.unicorn.studio: INFO
    # 两类日志独立控制级别，仍写入同一个文件。
    ACCESS_LOG: debug
    ADMIN_AUDIT: INFO
    org.springframework.security: WARN
