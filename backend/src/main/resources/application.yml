server:
  port: 8080
  address: 127.0.0.1

spring:
  datasource:
    url: jdbc:h2:file:./data/unicorn_studio
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    # 让 data.sql 在 Hibernate 建表之后执行
    defer-datasource-initialization: true
  sql:
    init:
      # 文件型 H2 不被视为 embedded 库，必须显式 always 才会执行 data.sql
      mode: always
      # data.sql 为 UTF-8，Windows 平台需显式指定，否则中文乱码
      encoding: UTF-8
  h2:
    console:
      enabled: false

app:
  cors:
    allowed-origins: http://localhost:5173
  ai:
    api-key: ${AI_API_KEY:}
    api-url: https://api.openai.com/v1/chat/completions
    model: gpt-3.5-turbo

logging:
  # 日志文件目录（相对运行目录）：logback-spring.xml 会写入
  # unicorn-studio.log（全量）与 unicorn-studio-error.log（仅错误）
  file:
    path: ./logs
  level:
    com.unicorn.studio: INFO
    org.springframework.security: WARN
