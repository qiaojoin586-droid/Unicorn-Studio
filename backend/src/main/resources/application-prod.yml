server:
  port: 8080


logging:
  level:
    com.unicorn.studio: WARN
    # ⚠️ 接口访问日志【必须】保留 INFO。
    # AccessLogFilter 打印的 [ACCESS] 行是 INFO 级，而它一旦挂在 com.unicorn.studio.* 命名空间下，
    # 就会被上面那条 WARN 整包压掉 —— 现象是「服务器上 logs/ 里没有接口日志」，
    # 但文件、滚动策略、appender 全都正常，容易误判成「日志没落盘」。
    # 现在 AccessLogFilter 用独立的无点号 logger 名 "ACCESS_LOG"（见该类注释与 AuditLogAspect 的 ADMIN_AUDIT），
    # 这里显式声明是为了把「生产也要留接口日志」这个意图写进配置，而不是靠默认继承 root。
    ACCESS_LOG: INFO
    org.springframework.security: WARN
