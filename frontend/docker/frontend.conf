# Unicorn Studio · 主站 nginx 服务端配置
#
# ── 改动前必读（三条都会造成「部署后功能坏掉」）──────────────────────────
# 1) proxy_pass 末尾【不能带 /】：
#    location /api/ 走的是 nginx 的「前缀替换」语义 —— proxy_pass 不带 URI 时保留原路径，
#    一旦写成 http://127.0.0.1:8080/ ，/api/ 这段会被替换成 / ，
#    于是 /api/admin/backups → /admin/backups（后端无此路径）→ 全部接口 404。
#    本项目规范写法见 docs/后台管理实施方案.md:891。
# 2) SSE 必须关缓冲：/api/ai/chat 用 SseEmitter 逐字下发，nginx 默认 proxy_buffering on
#    会把分片攒起来 → 流式退化成「卡一下冒一段」或直接超时。
#    docs/升级方案.md:344 把这条列为【高风险】，要求写死进模板。
# 3) 上传必须放开体积：nginx 默认 client_max_body_size 只有 1MB，
#    而后端允许 50MB（spring.servlet.multipart.max-request-size: 56MB）→ 超过 1MB 一律 413。
#
# ── 后端约束 ───────────────────────────────────────────────────────────
# 后端 application.yml 里是 server.address: 127.0.0.1（只监听回环），
# 所以 nginx 必须与后端【同机】。若 nginx 跑在容器里，127.0.0.1 指的是容器自身，
# 要改成宿主机地址：Docker Desktop 用 host.docker.internal，Linux 用网关 IP 或 --network=host。
# 所有后端接口都在 /api/** 下；上传文件由 /uploads/** 提供（WebMvcConfig 静态映射）。

server {
    listen 80;
    server_name 39.106.191.149;

    # 与后端 max-request-size(56MB) 对齐，否则后端那条 50MB 视频上限实际不可达
    client_max_body_size 56m;

    # gzip：注意【绝不含 text/event-stream】—— SSE 分片必须逐片直出。
    # （后端 server.compression.mime-types 也已刻意排除该类型，两侧一致）
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain text/xml application/xml image/svg+xml;

    # ⚠️ 本项目构建产物目录是 frontend/frontend/（vite.config.js 里 outDir: 'frontend'），
    #    不是 dist/。上传到服务器后请确认这里指向的确实是【构建产物】那一层。
    root /opt/frontend-app/frontend;
    index index.html index.htm;

    # 1. 带 hash 的静态资源：长缓存（文件名内容寻址，内容变则文件名变）
    #    用单一 Cache-Control 头 —— 不要同时写 expires 1y，那会发出两个 Cache-Control
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 绝不能长缓存，否则发版后用户仍会去加载旧 hash 的 chunk
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 2. 前端静态资源 + SPA 刷新 404 兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 3. 后端 API 反向代理
    #    ⚠️ proxy_pass 末尾【没有】斜杠，这是刻意的，别加
    location /api/ {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端用 trusted-proxy-count=1 + 取 parts[len-hops] 解析真实 IP（IpUtils），
        # 这里「追加」而非覆盖，正是该算法成立的前提，不要改成 $remote_addr
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★ SSE：关掉缓冲/缓存，逐片直出
        proxy_buffering off;
        proxy_cache off;
        # 后端 SseEmitter 超时 180s，而 nginx proxy_read_timeout 默认只有 60s
        # ⇒ 长回答会被 nginx 提前掐断，必须放大
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection "";
    }

    # 4. 上传的文件（轮播图 / 富文本图片 / 动态壁纸视频）
    #    统一交给后端提供：后端已带 nosniff 安全头与 1 年缓存（WebMvcConfig + SecurityHeadersFilter），
    #    且不需要在这里假设磁盘路径，最不容易配错。
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
    # 性能更优的替代写法（让 nginx 直接发文件，不经 Java）：
    # 需要把 alias 指向后端 app.upload.dir（默认 data/uploads）的真实绝对路径，
    # 且该路径下要有 yyyy/MM/ 子目录结构：
    #   location /uploads/ {
    #       alias /srv/unicorn/data/uploads/;
    #       add_header Cache-Control "public, max-age=3600";
    #       add_header X-Content-Type-Options "nosniff";
    #       try_files $uri =404;
    #   }

    # 5. 后台管理（独立构建 base '/admin/'，完整站点配置见 admin/admin.conf）
    #    ⚠️ 一个 host:port 上只能有一个 server 块，所以后台有两种接法，**二选一**：
    #
    #    (A) 独立端口 —— 用 admin/admin.conf（默认 listen 8082，可直接放 conf.d）。
    #        后台访问 http://39.106.191.149:8082/admin/，本文件**不用改**。
    #        ⚠️ 那条 URL 上的 /api/ 由 admin.conf 自己代理：后台接口是**根路径**
    #        /api/admin/**（admin/src/utils/request.ts 的 baseURL:'/'），
    #        不在 8082 上代理一份就会全部 404。
    #
    #    (B) 同域 /admin/ —— 不用新端口、不用改安全组，URL 也更好看。把下面 4 段
    #        贴进本 server { } 内即可。
    #        ⚠️ 后台产物在 /opt/frontend-app/admin/dist/（比前台多一层 dist），
    #           与 URL 前缀 /admin/ 不一致 ⇒ 这里**必须用 alias**；
    #           用 root /opt/frontend-app 会去找 .../admin/admin/...（少一层/多一层都错）。
    #        为什么不能为此单独放一个「只有 location 的 .conf」到 conf.d：
    #        conf.d/*.conf 是在 **http{} 层**被 include 的，而 location 只能待在
    #        server 块里 ⇒ nginx -t 会直接报 "location directive is not allowed here"。
    #
    # location = /admin { return 301 /admin/; }
    # location /admin/assets/ {
    #     alias /opt/frontend-app/admin/dist/assets/;
    #     add_header Cache-Control "public, max-age=31536000, immutable";
    #     add_header X-Content-Type-Options "nosniff";
    # }
    # location = /admin/index.html {          # SPA 回落的终点；少了它，缺文件时是 500 循环而非 404
    #     alias /opt/frontend-app/admin/dist/index.html;
    #     add_header Cache-Control "no-cache";
    #     add_header X-Content-Type-Options "nosniff";
    # }
    # location /admin/ {
    #     alias /opt/frontend-app/admin/dist/;
    #     add_header Cache-Control "no-cache";
    #     add_header X-Content-Type-Options "nosniff";
    #     try_files $uri $uri/ /admin/index.html;
    # }
    #    （(B) 下 /api/ 与 /uploads/ 复用上面第 3、4 段，不必再写。）

    # 6. AI 对话限流（后端已有限流，这层是双保险）
    #    注意 limit_req_zone 只能写在 http{} 里，需在 nginx.conf 顶部补：
    #      limit_req_zone $binary_remote_addr zone=ai_chat:10m rate=20r/m;
    #    再在此处对 /api/ai/chat 单独挂一个 location 并加 limit_req zone=ai_chat burst=5 nodelay;

    # 7. 后台登录接口限流同理（防撞库），可复用上面的 zone 思路
}
