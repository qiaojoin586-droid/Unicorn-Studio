<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- A-12：admin/index.html:5 一直引用 /admin/favicon.svg，但 admin/public/ 目录不存在，
       每次加载必然 404。此文件与 frontend/unicorn.svg 完全一致（品牌图标统一），
       Vite 会把 public/ 内容原样拷贝到 dist/ 根。 -->
  <defs>
    <linearGradient id="horn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <!-- Head -->
  <ellipse cx="50" cy="62" rx="28" ry="24" fill="white" stroke="#E0E7FF" stroke-width="2"/>
  <!-- Horn -->
  <polygon points="50,8 42,38 58,38" fill="url(#horn)"/>
  <!-- Ear left -->
  <ellipse cx="30" cy="42" rx="8" ry="12" fill="white" stroke="#E0E7FF" stroke-width="1.5" transform="rotate(-15 30 42)"/>
  <!-- Ear right -->
  <ellipse cx="70" cy="42" rx="8" ry="12" fill="white" stroke="#E0E7FF" stroke-width="1.5" transform="rotate(15 70 42)"/>
  <!-- Eye left -->
  <circle cx="40" cy="58" r="3.5" fill="#4338CA"/>
  <circle cx="41" cy="57" r="1.2" fill="white"/>
  <!-- Eye right -->
  <circle cx="60" cy="58" r="3.5" fill="#4338CA"/>
  <circle cx="61" cy="57" r="1.2" fill="white"/>
  <!-- Nose -->
  <ellipse cx="50" cy="70" rx="2" ry="1.5" fill="#C7D2FE"/>
  <!-- Mouth -->
  <path d="M44 75 Q50 80 56 75" fill="none" stroke="#C7D2FE" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Sparkles -->
  <circle cx="22" cy="25" r="2" fill="#FFD700" opacity="0.8"/>
  <circle cx="78" cy="20" r="1.5" fill="#FFD700" opacity="0.6"/>
  <circle cx="82" cy="50" r="1.8" fill="#A78BFA" opacity="0.7"/>
</svg>
