# Unicorn Studio · 后台管理 nginx 站点配置（独立 server 块，可直接放入 conf.d）
#
# ── 为什么这个文件必须有 server{} 包裹 ────────────────────────────────────────
# nginx.conf 里的 `include /etc/nginx/conf.d/*.conf;` 位于 **http{} 上下文**，
# 而 `location` 只能写在 server{}（或 location{}）里。
# ⇒ 放进 conf.d 的文件**必须**自带 server 块，否则 `nginx -t` 直接报：
#       "location" directive is not allowed here
#
# ── 为什么用独立端口，而不是复用 80 ───────────────────────────────────────────
# 主站 frontend.conf 已占用 `listen 80; server_name 39.106.191.149;`。
# 本文件若再写一份同样的 listen + server_name，nginx 只会警告
#     nginx: [warn] conflicting server name "39.106.191.149" on 0.0.0.0:80, ignored
# 然后**只使用先出现的那个** —— 后台会永久 404，且没有任何报错页。
# 同一个 host:port 上「一个站点」只能有一个 server 块，所以后台要么换端口 / 换域名，
# 要么把 location 内联进主站 server 块（见文件末尾「二选一」）。
#
# ⚠️ 不要用 8081：后端 `management.server.port` 默认就是 8081。
# ⚠️ 需放行 8082：阿里云安全组入方向 + 本机防火墙；确认未被占用：ss -tlnp | grep ':8082'
# ⚠️ 不会新增接口暴露面：8082 上的 /api/ 与 :80 上的是同一套后端，只是多一个入口。
#
# ── 访问入口 ─────────────────────────────────────────────────────────────────
#   http://39.106.191.149:8082/admin/     ← 注意结尾斜杠（/admin 会 301 补上）
#   访问端口根 http://39.106.191.149:8082/  会 301 到 /admin/
#
# ── 服务器目录（★ 注意 admin 产物比前台多一层 dist）─────────────────────────
#   /opt/frontend-app/frontend/          前台产物（frontend.conf 的 root）
#   /opt/frontend-app/admin/dist/        后台产物 ← 本文件就是指向这里
#
#   因为「URL 前缀（/admin/）」与「文件系统路径（…/admin/dist/）」不一致，
#   这里**必须用 `alias` 而不是 `root`**：
#     · root 是「根目录 + 完整 URI」⇒ `location /admin/` + `root /opt/frontend-app/admin/dist`
#       会去找 /opt/frontend-app/admin/dist/admin/... —— 多出一层，必然 404。
#     · alias 是「把 location 前缀整段替换成给定路径」⇒ 正是这种错位场景的正解。
#   （如果你更想用 root（没有 alias 的路径拼接顾虑），就把 admin/dist/* 直接放到
#     /opt/frontend-app/admin/、去掉多出来的 dist 层，然后把 alias 换成 root /opt/frontend-app;
#     —— 两种都行，选一种，别混。）
#
# ── 部署 ─────────────────────────────────────────────────────────────────────
#   1. cd admin && npm run build              → 产物 admin/dist/
#   2. 上传【admin/dist/ 里的内容】→ /opt/frontend-app/admin/dist/
#      核对入口 hash 与本地一致：
#        grep -o 'admin/assets/index-[A-Za-z0-9_-]*\.js' /opt/frontend-app/admin/dist/index.html
#      该文件里引用的路径形如 /admin/assets/…、/admin/favicon.svg（vite base: '/admin/'）。
#   3. 本文件 → /etc/nginx/conf.d/admin.conf
#   4. nginx -t && nginx -s reload
#
# ⚠️ 产物落点易错：本地 `admin/dist/` 才是后台产物；前台产物在 `frontend/frontend/`
#    （`frontend/dist/` 与 `frontend/release/` 是 2026-08-13 的旧包，别传错）。

server {
    listen 8082;
    server_name 39.106.191.149;

    # 与后端 max-request-size(56MB) 对齐，否则后台上传大图/视频一律 413
    client_max_body_size 56m;

    # gzip：注意【绝不含 text/event-stream】—— 本端口同样要跑 SSE（AI 配置页等）
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain text/xml application/xml image/svg+xml;

    # 本 vhost 的文档根 = 后台产物目录（静态段实际都走 alias，这里写上是为了语义清晰、
    # 也给「万一没命中任何 location」的情况一个确定的行为）
    root /opt/frontend-app/admin/dist;
    index index.html;

    # 访问端口根 → 直接进后台，否则会看到 404 而误判成「没部署成功」
    location = / {
        return 301 /admin/;
    }

    # ── ① 后台静态资源 ──────────────────────────────────────────────────────

    # /admin（不带斜杠）→ 301 到 /admin/
    # 少了这一步，/admin 会落到其它 location，出现「页面能开但内容不对」的诡异现象
    location = /admin {
        return 301 /admin/;
    }

    # 带 hash 的资源：长缓存（文件名内容寻址，内容变则文件名变）。
    # 这里刻意【不写 try_files】：本 location 没有 SPA 兜底，文件缺失时 nginx 本来
    # 就返回 404 —— 这正是我们要的（缺失的 .js 若以 200 + text/html 返回，
    # 浏览器会报 "Unexpected token '<'"，看着像打包坏了）。
    location /admin/assets/ {
        alias /opt/frontend-app/admin/dist/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # 入口页单独一个 exact-match location，作用有二：
    #  ① 让 index.html 明确走 no-cache（其实后面 /admin/ 也设了，这里是双保险）；
    #  ② ★ 给 SPA 回落一个**终点**：/admin/ 的 try_files 会内部重定向到
    #     /admin/index.html，如果该文件**不存在**（比如产物没传全），
    #     没有这个 exact 块就会再落回 /admin/ → try_files → 又回 /admin/index.html，
    #     nginx 直接报 500 "rewrite or internal redirection cycle"，
    #     而 500 比 404 难查得多。加了它，缺文件就是干净的 404。
    #  （exact-match location 不继承别的 location 的 alias，所以路径要写全到文件名。）
    location = /admin/index.html {
        alias /opt/frontend-app/admin/dist/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }

    # SPA 兜底 + 入口页不缓存。
    # router/index.ts 是 createWebHistory(BASE_URL='/admin/')（history 模式），
    # 直接刷新 /admin/works、/admin/users/3 这类深链必须回落 index.html。
    # index.html 若被缓存，发版后浏览器会继续引用已不存在的旧 hash chunk → 白屏，
    # 所以整个 /admin/ 前缀统一 no-cache（含 favicon 之类，体积小，不值得再细分）。
    # 注：alias + try_files $uri 是安全的（nginx 会把 location 前缀整段换掉再拼路径）；
    #     回落目标 /admin/index.html 是 URI，会重新进入本 location ⇒ 同样正确。
    location /admin/ {
        alias /opt/frontend-app/admin/dist/;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri $uri/ /admin/index.html;
    }

    # ── ② 后端接口（后台这份必须自己代理）────────────────────────────────────
    # 后台的接口走**根路径** /api/admin/**（admin/src/utils/request.ts 的 baseURL: '/'），
    # 而浏览器地址是 :8082 ⇒ 同源请求打到 8082 ⇒ 不在本 server 块里代理就会全部 404。
    # 同源 ⇒ 后端 CORS 不会拦（Origin 与本机 origin 相同则不算跨域请求）。
    # ⚠️ proxy_pass 末尾【不要】带斜杠：带了会把 /api/ 前缀替换掉
    #    ⇒ /api/admin/works 变成 /admin/works ⇒ 全接口 404。
    location /api/ {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端 IpUtils 按 trusted-proxy-count + parts[len-hops] 取真实 IP，
        # 「追加」语义是该算法成立的前提，不要改成 $remote_addr
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE：关缓冲 + 放大超时（后端 SseEmitter 180s，nginx 默认只 60s ⇒ 长回答被掐断）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection "";
    }

    # 后台里预览上传的图片/视频（轮播图、富文本图片、动态壁纸）
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # 兜底：其余路径一律 404。刻意不用 `try_files ... /admin/index.html`，
    # 否则拼错的 URL 会以 200 + HTML 返回，变成「假成功」。
    location / {
        return 404;
    }

    # ── ③ 可选加固 ──────────────────────────────────────────────────────────
    # A) 后台只允许固定 IP 访问（**若你有固定出口 IP，强烈建议**）。
    #    页面与接口两处都要挡，只挡页面等于没挡：
    #      location /admin/ { allow 1.2.3.4; deny all; ...原有指令... }
    #      location /api/   { allow 1.2.3.4; deny all; ...原有指令... }
    # B) 登录接口限流（防撞库，后端已有 5 次/分 + 账号锁定，这层是兜底）。
    #    limit_req_zone 只能定义在 http{}（/etc/nginx/nginx.conf）：
    #      limit_req_zone $binary_remote_addr zone=admin_login:10m rate=20r/m;
    #    然后在下方补一个 location（它比 /api/ 长 ⇒ 会优先命中，
    #    所以代理头必须照抄上面 location /api/ 的整段，不能只写 limit_req）：
    #      location = /api/admin/auth/login {
    #          limit_req zone=admin_login burst=5 nodelay;
    #          proxy_pass http://127.0.0.1:8080;
    #          ...proxy_http_version / proxy_set_header 同 location /api/...
    #      }

    # ── 二选一：不想多开端口？────────────────────────────────────────────────
    # 删掉本文件（或不要放进 conf.d），改为把下面 4 段 location 贴进
    # frontend/docker/frontend.conf 的 server { } 内（那边已留好注释位）。
    # 这样后台就是同域的 http://39.106.191.149/admin/，无需新端口、无需改安全组：
    #
    # location = /admin { return 301 /admin/; }
    # location /admin/assets/ {
    #     alias /opt/frontend-app/admin/dist/assets/;
    #     add_header Cache-Control "public, max-age=31536000, immutable";
    #     add_header X-Content-Type-Options "nosniff";
    # }
    # location = /admin/index.html {          # SPA 回落的终点（缺它则是 500 循环而非 404）
    #     alias /opt/frontend-app/admin/dist/index.html;
    #     add_header Cache-Control "no-cache";
    #     add_header X-Content-Type-Options "nosniff";
    # }
    # location /admin/ {
    #     alias /opt/frontend-app/admin/dist/;
    #     add_header Cache-Control "no-cache";
    #     add_header X-Content-Type-Options "nosniff";
    #     try_files $uri $uri/ /admin/index.html;
    # }
    # （同域时 /api/ 与 /uploads/ 复用主站已有的那两个 location，不必再写。）
}
