# 由官方 nginx 镜像的 http 块加载本文件。
server {
    listen 80;
    server_name afq.asia www.afq.asia;
    return 301 https://www.afq.asia$request_uri;
}

server {
    listen 443 ssl;
    server_name afq.asia;
    ssl_certificate /etc/nginx/certs/afq.asia.pem;
    ssl_certificate_key /etc/nginx/certs/afq.asia.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://www.afq.asia$request_uri;
}

server {
    listen 443 ssl;
    server_name www.afq.asia;

    ssl_certificate /etc/nginx/certs/afq.asia.pem;
    ssl_certificate_key /etc/nginx/certs/afq.asia.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AFQ_SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 60m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # Docker 内置 DNS，后端容器更新 IP 后也能重新解析。
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $backend unicorn-backend:8080;

    location ^~ /api/ {
        # 末尾不加斜杠，保留后端需要的 /api/ 路径。
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        # AI SSE 逐段输出；不让 Nginx 缓冲成整段回复。
        proxy_buffering off;
        proxy_cache off;
    }

    location ^~ /uploads/ {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin { return 301 /admin/; }
    location ^~ /admin/assets/ { try_files $uri =404; }
    location ^~ /admin/ { try_files $uri $uri/ /admin/index.html; }
    location ^~ /assets/ { try_files $uri =404; }
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }

    # 深层路由刷新仍返回主站入口；入口 HTML 不使用长期缓存。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }
}
